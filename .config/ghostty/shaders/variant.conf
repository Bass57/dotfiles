# Ghostty cursor-shader trail color. Three modes:
#
# RAINBOW=1          -> trail cycles through all neon colors over time ("mix all")
# RAINBOW_SPEED=0.40 -> how fast hues rotate (lower = slower)
# CUSTOM_COLOR=#rrggbb -> fixed vivid color (used when RAINBOW=0)
# ACCENT_IDX=N       -> follow the theme accent (used when RAINBOW=0)
RAINBOW=1
RAINBOW_SPEED=0.40
CUSTOM_COLOR=#00E5FF
ACCENT_IDX=6