# Ghostty cursor-shader trail color. Two ways to set it:
#
# CUSTOM_COLOR=#rrggbb   -> use this exact vivid color (wins over ACCENT_IDX)
# ACCENT_IDX=N           -> follow the theme: trail = palette index N of the
#                           active Omarchy theme (6=cyan, 4=blue, 5=purple, 1=red)
#
# Leave CUSTOM_COLOR empty (value blank) to fall back to ACCENT_IDX.
CUSTOM_COLOR=#00E5FF
ACCENT_IDX=6